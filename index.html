<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lamsa | لَمْسَة — اختار وجهتك</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Montserrat:wght@700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #09090b;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      overflow: hidden;
    }

    /* ===== FULL-PAGE CENTERED LAYOUT ===== */
    .splash {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient background glows */
    .splash::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(197,160,114,0.10) 0%, transparent 65%);
      pointer-events: none;
      animation: breathe 6s ease-in-out infinite;
    }
    .splash::after {
      content: '';
      position: absolute;
      bottom: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,101,0,0.08) 0%, transparent 65%);
      pointer-events: none;
      animation: breathe 6s ease-in-out infinite reverse;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
      50%       { opacity: 1;   transform: translateX(-50%) scale(1.15); }
    }

    /* ===== SPINNING LOGO ===== */
    .splash-logo-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      margin-bottom: 36px;
      z-index: 2;
      animation: rotate-slow 30s linear infinite;
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(197,160,114,0.25),
                  0 0 90px rgba(255,101,0,0.10);
      flex-shrink: 0;
    }

    .splash-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }

    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ===== TAGLINE ===== */
    .splash-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
      z-index: 2;
    }

    .splash-title {
      font-family: 'Cairo', sans-serif;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      font-weight: 900;
      color: rgba(255,255,255,0.75);
      margin-bottom: 48px;
      z-index: 2;
    }

    /* ===== CHOICE BUTTONS ===== */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 420px;
      z-index: 2;
    }

    .choice-btn {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px 28px;
      border-radius: 20px;
      text-decoration: none;
      transition: transform 0.25s, box-shadow 0.25s;
      position: relative;
      overflow: hidden;
      text-align: right;
    }

    .choice-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .choice-btn:hover { transform: translateY(-4px); }
    .choice-btn:hover::before { opacity: 1; }

    /* Agency Button */
    .btn-agency {
      background: linear-gradient(135deg, #1a1520 0%, #120f18 100%);
      border: 1.5px solid rgba(197,160,114,0.35);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(197,160,114,0.1);
    }
    .btn-agency::before {
      background: linear-gradient(135deg, rgba(197,160,114,0.07), transparent);
    }
    .btn-agency:hover {
      border-color: rgba(197,160,114,0.7);
      box-shadow: 0 16px 50px rgba(197,160,114,0.2);
    }

    .btn-agency .btn-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(197,160,114,0.25), rgba(197,160,114,0.08));
      border: 1.5px solid rgba(197,160,114,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
      color: #c5a072;
    }

    .btn-agency .btn-label {
      flex: 1;
    }

    .btn-agency .btn-label strong {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: #c5a072;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .btn-agency .btn-label span {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.45);
      font-weight: 600;
    }

    .btn-agency .btn-arrow {
      color: rgba(197,160,114,0.5);
      font-size: 1rem;
      transition: transform 0.25s, color 0.25s;
    }
    .btn-agency:hover .btn-arrow {
      transform: translateX(-5px);
      color: #c5a072;
    }

    /* Drops Button */
    .btn-drops {
      background: linear-gradient(135deg, #1a0f08 0%, #110a04 100%);
      border: 1.5px solid rgba(255,101,0,0.35);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,101,0,0.1);
    }
    .btn-drops::before {
      background: linear-gradient(135deg, rgba(255,101,0,0.07), transparent);
    }
    .btn-drops:hover {
      border-color: rgba(255,101,0,0.7);
      box-shadow: 0 16px 50px rgba(255,101,0,0.2);
    }

    .btn-drops .btn-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,101,0,0.25), rgba(255,101,0,0.08));
      border: 1.5px solid rgba(255,101,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }

    .btn-drops .btn-label {
      flex: 1;
    }

    .btn-drops .btn-label strong {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: #FF6500;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .btn-drops .btn-label span {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.45);
      font-weight: 600;
    }

    .btn-drops .btn-arrow {
      color: rgba(255,101,0,0.5);
      font-size: 1rem;
      transition: transform 0.25s, color 0.25s;
    }
    .btn-drops:hover .btn-arrow {
      transform: translateX(-5px);
      color: #FF6500;
    }

    /* ===== BOTTOM COPYRIGHT ===== */
    .splash-footer {
      position: absolute;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.18);
      z-index: 2;
    }

    /* ===== MOBILE TWEAKS ===== */
    @media (max-width: 480px) {
      .splash-logo-wrap { width: 130px; height: 130px; margin-bottom: 28px; }
      .choice-btn { padding: 18px 20px; gap: 16px; }
      .btn-agency .btn-icon,
      .btn-drops .btn-icon { width: 48px; height: 48px; font-size: 1.3rem; border-radius: 12px; }
      .btn-agency .btn-label strong,
      .btn-drops .btn-label strong { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="splash">

    <!-- SPINNING LOGO -->
    <div class="splash-logo-wrap">
      <img src="logo.png" alt="Lamsa" />
    </div>

    <!-- TAGLINE -->
    <div class="splash-tagline">LAMSA ✦ لَمْسَة</div>
    <div class="splash-title">إنت داخل عشان إيه؟</div>

    <!-- TWO CHOICE BUTTONS -->
    <div class="choices">

      <!-- Agency -->
      <a href="agency.html" class="choice-btn btn-agency">
        <div class="btn-icon">
          <i class="fa-solid fa-pen-nib"></i>
        </div>
        <div class="btn-label">
          <strong>Creative Agency</strong>
          <span>تصميم لوجو · هوية بصرية · مونتاج فيديو</span>
        </div>
        <i class="fa-solid fa-chevron-left btn-arrow"></i>
      </a>

      <!-- Drops -->
      <a href="drops.html" class="choice-btn btn-drops">
        <div class="btn-icon">🔥</div>
        <div class="btn-label">
          <strong>Drops — ملابس</strong>
          <span>تيشرتات · هوديز · بنطلونات بطباعة مخصصة</span>
        </div>
        <i class="fa-solid fa-chevron-left btn-arrow"></i>
      </a>

    </div>

    <div class="splash-footer">© 2025 Lamsa Creative Media & Design</div>
  </div>
</body>
</html>
